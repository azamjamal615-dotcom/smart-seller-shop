<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Seller Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:7px 0 0;
    color:#ccc;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.top{
    background:white;
    padding:18px;
    border-radius:15px;
    margin-bottom:18px;
    box-shadow:0 3px 15px #ddd;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 3px 15px #ddd;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.product h2{
    font-size:20px;
    margin:12px 0 7px;
}

.description{
    color:#666;
    font-size:14px;
    min-height:20px;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.stock{
    color:#555;
    margin-bottom:10px;
}

.category{
    display:inline-block;
    background:#e5e7eb;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
}

.service{
    display:block;
    text-align:center;
    margin-top:20px;
    background:#16a34a;
    color:white;
    padding:15px;
    border-radius:10px;
    text-decoration:none;
}

.loading,
.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:15px;
}

@media(max-width:600px){

    .products{
        grid-template-columns:1fr;
    }

    .product img{
        height:230px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Smart Seller Shop</h1>
    <p>Online Shopping</p>
</div>

<div class="container">

    <div class="top">
        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Search product..."
            oninput="filterProducts()"
        >
    </div>

    <div id="products" class="products">
        <div class="loading">
            Products loading...
        </div>
    </div>

    <a class="service" href="customer-service.html">
        💬 Customer Service
    </a>

</div>

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://cgrwiwzqiusvjibpjzdv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_du1gsmfC1UqGUpc40-uHiQ_P-2T8wnV";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   VARIABLES
================================ */

let products = [];


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    const box =
        document.getElementById("products");

    box.innerHTML =
        '<div class="loading">Products loading...</div>';

    const {data,error} =
        await supabaseClient
        .from("Products")
        .select("*")
        .order("id",{ascending:false});


    if(error){

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                ❌ Products load nahi ho rahe.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }


    products = data || [];

    showProducts(products);
}


/* ================================
   SHOW PRODUCTS
================================ */

function showProducts(list){

    const box =
        document.getElementById("products");

    box.innerHTML = "";


    if(!list.length){

        box.innerHTML = `
            <div class="empty">
                🛍️ No products found.
            </div>
        `;

        return;
    }


    list.forEach(function(product){

        const name =
            product["Name"] ??
            product.name ??
            "Product";


        const price =
            product["Price"] ??
            product.price ??
            0;


        const stock =
            product["Stock"] ??
            product.stock ??
            0;


        const category =
            product["Category"] ??
            product.category ??
            "Other";


        const image =
            product["Image url"] ??
            product["Image URL"] ??
            product.image ??
            product.image_url ??
            "";


        const description =
            product["Description"] ??
            product.description ??
            "";


        let imageHTML = "";

        if(image){

            imageHTML = `
                <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(name)}"
                    onerror="this.style.display='none'"
                >
            `;
        }


        box.innerHTML += `

            <div class="product">

                ${imageHTML}

                <span class="category">
                    ${escapeHTML(category)}
                </span>

                <h2>
                    ${escapeHTML(name)}
                </h2>

                <div class="description">
                    ${escapeHTML(description)}
                </div>

                <div class="price">
                    $${Number(price).toFixed(2)}
                </div>

                <div class="stock">
                    📦 Stock: ${Number(stock)}
                </div>

                <button onclick="buyProduct('${escapeHTML(name)}')">
                    🛒 Buy / Order
                </button>

            </div>

        `;

    });

}


/* ================================
   SEARCH
================================ */

function filterProducts(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        products.filter(function(product){

            const name =
                String(
                    product["Name"] ??
                    product.name ??
                    ""
                ).toLowerCase();


            const category =
                String(
                    product["Category"] ??
                    product.category ??
                    ""
                ).toLowerCase();


            return name.includes(search) ||
                   category.includes(search);

        });


    showProducts(filtered);
}


/* ================================
   BUY
================================ */

function buyProduct(name){

    window.location.href =
        "customer-service.html?product=" +
        encodeURIComponent(name);

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ================================
   START
================================ */

loadProducts();

</script>

</body>
</html>
