<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

.header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
  text-align: center;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #1677ff;
  color: white;
  font-size: 17px;
}

a {
  text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
  <h1>Smart Seller Shop</h1>
</div>

<div class="container">
  <div class="box">
    <h2>Welcome</h2>
    <p>Customer Service ke liye neeche button dabayein.</p>

    <a href="customer-service.html">
      <button>Customer Service</button>
    </a>
  </div>
</div>

</body>
</html>
