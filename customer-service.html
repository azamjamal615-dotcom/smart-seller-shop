<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Service - Smart Seller Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f8;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.header h1{
  font-size:24px;
}

.header p{
  margin-top:6px;
  color:#cbd5e1;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h2{
  margin-bottom:8px;
}

.info{
  color:#666;
  margin-bottom:20px;
  line-height:1.5;
}

label{
  display:block;
  margin:14px 0 6px;
  font-weight:bold;
}

input, textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

#result{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>Smart Seller Shop</h1>
  <p>Customer Service</p>
</div>

<div class="container">

  <div class="card">

    <h2>How can we help you?</h2>

    <p class="info">
      Payment karni hai, payment account chahiye,
      order ke bare mein poochna hai ya koi aur help chahiye?
      Neeche message bhejein.
    </p>

    <label>Your Name</label>
    <input id="name" type="text" placeholder="Enter your name">

    <label>Email</label>
    <input id="email" type="email" placeholder="Enter your email">

    <label>Order Number</label>
    <input id="order" type="text" placeholder="Order number (optional)">

    <label>Message</label>
    <textarea id="message"
      placeholder="Example: Mujhe payment karni hai, payment account details dein."></textarea>

    <button onclick="sendMessage()">
      Send Message
    </button>

    <div id="result"></div>

  </div>

</div>

<script>

async function sendMessage(){

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const order = document.getElementById("order").value.trim();
  const message = document.getElementById("message").value.trim();
  const result = document.getElementById("result");

  if(!name || !email || !message){

    result.style.display="block";
    result.style.background="#fee2e2";
    result.style.color="#991b1b";
    result.innerText="Please name, email aur message fill karein.";
    return;
  }

  result.style.display="block";
  result.style.background="#e0f2fe";
  result.style.color="#075985";
  result.innerText="Message sending...";

  /*
   * Supabase connection next step mein add karenge.
   */

  setTimeout(function(){

    result.style.background="#dcfce7";
    result.style.color="#166534";

    result.innerText=
      "Message received! Customer Service aapko website ke andar reply karegi.";

  },800);
}

</script>

</body>
</html>
