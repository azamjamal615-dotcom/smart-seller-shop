<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop - Customer Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#202124}
.container{max-width:650px;margin:30px auto;padding:15px}
.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 15px #ddd}
h1{margin-top:0}
textarea{width:100%;min-height:170px;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;resize:vertical;outline:none}
textarea:focus{border-color:#1877f2}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;background:#1877f2;color:#fff;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#status{display:none;margin-top:12px;padding:12px;border-radius:10px;font-weight:bold}
.ok{display:block!important;background:#dcfce7;color:#166534}
.err{display:block!important;background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="container">
  <div class="box">
    <h1>💬 Customer Service</h1>
    <p>Payment details, orders, or any help? Send us a message.</p>

    <textarea id="message" placeholder="Write your message..."></textarea>

    <button id="sendBtn" type="button">Send Message</button>
    <div id="status"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cgrwiwzqiusvjibpjzdv.supabase.co";
const SUPABASE_KEY = "sb_publishable_du1gsmfC1UqGUpc40-uHiQ_P-2T8wnV";

const messageBox = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");

function showStatus(text, ok){
  statusBox.textContent = text;
  statusBox.className = ok ? "ok" : "err";
}

sendBtn.addEventListener("click", async function(){
  const message = messageBox.value.trim();

  if(!message){
    showStatus("Please write a message first.", false);
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";
  statusBox.className = "";
  statusBox.style.display = "none";

  try{
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/support_tickets",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          customer_name:"Customer",
          customer_email:null,
          subject:"Customer Service",
          message:message,
          status:"Open"
        })
      }
    );

    const text = await response.text();

    if(!response.ok){
      throw new Error(text || "Database rejected the message.");
    }

    messageBox.value = "";
    showStatus("Message sent successfully. ✅", true);

  }catch(error){
    console.error(error);
    showStatus("Message could not be sent. Please run the SQL fix first.", false);
  }finally{
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Message";
  }
});
</script>
</body>
</html>
