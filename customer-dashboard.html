<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
color:#172033;
font-family:Arial,sans-serif;
font-size:13px;
padding-bottom:20px
}

.header{
background:#111827;
color:#fff;
text-align:center;
padding:10px 8px
}
.header h1{margin:0;font-size:17px}
.header p{margin:3px 0 0;color:#cbd5e1;font-size:10px}

.container{
max-width:650px;
margin:auto;
padding:7px
}

.menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
margin-bottom:8px
}

.menu button{
border:0;
background:#fff;
color:#222;
padding:8px 4px;
border-radius:8px;
box-shadow:0 1px 5px #ddd;
font-size:11px;
cursor:pointer
}

.menu button.active{
background:#1877f2;
color:#fff
}

.page{display:none}
.page.active{display:block}

.card{
background:#fff;
border-radius:12px;
padding:11px;
margin-bottom:8px;
box-shadow:0 2px 7px #ddd
}

.card h2{
margin:0 0 7px;
font-size:15px
}

.hero{
background:linear-gradient(135deg,#123e64,#285579);
color:#fff;
border-radius:16px;
padding:14px;
margin-bottom:9px
}

.customer-line{
display:flex;
align-items:center;
gap:9px;
margin:5px 0 12px
}

.avatar{
width:43px;
height:43px;
border-radius:14px;
background:#466a88;
border:2px solid #6687a2;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
font-weight:bold
}

.customer-line h2{
margin:0 0 3px;
font-size:17px
}

.customer-line p{
margin:0;
color:#e4edf5;
font-size:10px
}

.money-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.money{
background:rgba(255,255,255,.13);
border:1px solid rgba(255,255,255,.15);
border-radius:13px;
padding:9px 10px
}

.money-label{
color:#d7e2eb;
font-size:10px
}

.money-value{
font-size:18px;
font-weight:bold;
margin-top:4px
}

.quick{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:9px
}

.quick button{
border:1px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.13);
color:#fff;
border-radius:15px;
padding:7px 10px;
font-size:11px;
cursor:pointer
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px
}

.stat{
background:#fff;
border-radius:12px;
padding:10px 5px;
box-shadow:0 1px 6px #ddd;
text-align:center
}

.stat h3{
margin:4px 0 2px;
font-size:17px
}

.stat p{
margin:0;
color:#777;
font-size:10px
}

.product-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px
}

.product{
background:#fff;
border-radius:10px;
padding:7px;
box-shadow:0 1px 6px #ddd
}

.product img{
width:100%;
height:120px;
object-fit:cover;
border-radius:7px
}

.product h3{
margin:6px 0 3px;
font-size:13px
}

.product p{
margin:3px 0;
font-size:10px
}

.price{
font-weight:bold;
color:#1877f2
}

.action{
border:0;
background:#1877f2;
color:#fff;
padding:8px 11px;
border-radius:7px;
cursor:pointer;
font-size:11px
}

.green{background:#16a34a}
.red{background:#dc2626}

input,select,textarea{
width:100%;
padding:8px;
border:1px solid #ddd;
border-radius:7px;
font-size:12px;
margin:3px 0 7px
}

textarea{
min-height:65px
}

label{
font-size:10px;
font-weight:bold
}

.total{
text-align:right;
font-size:16px;
font-weight:bold;
margin:9px 0
}

.box{
border:1px solid #ddd;
border-radius:9px;
padding:9px;
margin-bottom:7px;
background:#fafafa
}

.box p{
margin:4px 0;
font-size:11px
}

.status{
display:inline-block;
padding:3px 6px;
border-radius:12px;
background:#fef3c7;
color:#92400e;
font-size:10px;
font-weight:bold
}

.success{
background:#dcfce7;
color:#166534;
padding:8px;
border-radius:7px;
margin-top:7px;
font-size:11px
}

.error{
background:#fee2e2;
color:#991b1b;
padding:8px;
border-radius:7px;
margin-top:7px;
font-size:11px
}

.empty{
text-align:center;
color:#777;
padding:15px;
font-size:11px
}

@media(max-width:600px){

.container{
padding:6px
}

.menu{
gap:4px
}

.menu button{
padding:7px 3px;
font-size:10px
}

.hero{
padding:12px;
border-radius:14px
}

.money-grid{
gap:5px
}

.money{
padding:8px
}

.money-value{
font-size:17px
}

.quick button{
padding:6px 8px;
font-size:10px
}

.product-grid{
gap:6px
}

.product img{
height:105px
}

.card{
padding:9px;
margin-bottom:7px
}

}
</style>
