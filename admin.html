<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:7px 0 0;
    color:#ccc;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:16px;
    box-shadow:0 3px 15px #ddd;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:white;
    padding:20px 10px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 12px #ddd;
}

.stat h2{
    margin:0;
    font-size:30px;
}

.stat p{
    margin:8px 0 0;
    color:#777;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#0d65d9;
}

.cancel{
    background:#777;
    margin-top:8px;
}

.delete{
    background:#e53935;
}

.edit{
    background:#ff9800;
    margin-bottom:7px;
}

.product{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.product img{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}

.product h3{
    margin:5px 0;
}

.product p{
    margin:6px 0;
    color:#555;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Smart Seller Shop</h1>
    <p>Admin Panel</p>
</div>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h2 id="productCount">0</h2>
            <p>Products</p>
        </div>

        <div class="stat">
            <h2 id="messageCount">0</h2>
            <p>Messages</p>
        </div>

        <div class="stat">
            <h2 id="stockCount">0</h2>
            <p>Total Stock</p>
        </div>

    </div>

    <br>

    <div class="card">

        <h2>➕ Add New Product</h2>

        <label>Product Name</label>
        <input id="name" type="text" placeholder="Example: Samsung Phone">

        <label>Price</label>
        <input id="price" type="number" placeholder="100">

        <label>Stock</label>
        <input id="stock" type="number" placeholder="10">

        <label>Category</label>
        <select id="category">
            <option value="Phone">Phone</option>
            <option value="Laptop">Laptop</option>
            <option value="Accessories">Accessories</option>
            <option value="Other">Other</option>
        </select>

        <label>Product Image URL</label>
        <input id="image" type="text"
        placeholder="https://example.com/image.jpg">

        <button id="saveBtn" onclick="saveProduct()">
            Add Product
        </button>

        <button class="cancel"
        id="cancelBtn"
        onclick="cancelEdit()"
        style="display:none">
            Cancel Edit
        </button>

    </div>

    <div class="card">

        <h2>📦 Products</h2>

        <div id="products"></div>

    </div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("smartSellerProducts")) || [];

let editIndex = -1;


/* SAVE PRODUCT */

function saveProduct(){

    let name = document.getElementById("name").value.trim();
    let price = document.getElementById("price").value;
    let stock = document.getElementById("stock").value;
    let category = document.getElementById("category").value;
    let image = document.getElementById("image").value.trim();

    if(!name || !price || !stock){

        alert("Please fill Product Name, Price and Stock.");

        return;
    }

    let product = {
        name:name,
        price:price,
        stock:stock,
        category:category,
        image:image
    };


    if(editIndex === -1){

        products.push(product);

        alert("Product Added Successfully!");

    }else{

        products[editIndex] = product;

        alert("Product Updated Successfully!");

        editIndex = -1;

        document.getElementById("saveBtn").innerText =
        "Add Product";

        document.getElementById("cancelBtn").style.display =
        "none";
    }


    localStorage.setItem(
        "smartSellerProducts",
        JSON.stringify(products)
    );


    clearForm();

    showProducts();

}


/* SHOW PRODUCTS */

function showProducts(){

    let box = document.getElementById("products");

    box.innerHTML = "";


    if(products.length === 0){

        box.innerHTML =
        "<p>No products added yet.</p>";

    }


    products.forEach(function(product,index){

        let imageHTML = "";

        if(product.image){

            imageHTML =
            `<img src="${product.image}"
            onerror="this.style.display='none'">`;

        }


        box.innerHTML += `

        <div class="product">

            ${imageHTML}

            <h3>${product.name}</h3>

            <p><b>Price:</b> $${product.price}</p>

            <p><b>Stock:</b> ${product.stock}</p>

            <p><b>Category:</b> ${product.category}</p>

            <button class="edit"
            onclick="editProduct(${index})">
            ✏️ Edit Product
            </button>

            <button class="delete"
            onclick="deleteProduct(${index})">
            🗑️ Delete Product
            </button>

        </div>

        `;

    });


    updateStats();

}


/* EDIT */

function editProduct(index){

    let product = products[index];

    document.getElementById("name").value =
    product.name;

    document.getElementById("price").value =
    product.price;

    document.getElementById("stock").value =
    product.stock;

    document.getElementById("category").value =
    product.category;

    document.getElementById("image").value =
    product.image;


    editIndex = index;


    document.getElementById("saveBtn").innerText =
    "Update Product";

    document.getElementById("cancelBtn").style.display =
    "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* DELETE */

function deleteProduct(index){

    if(confirm("Delete this product?")){

        products.splice(index,1);

        localStorage.setItem(
            "smartSellerProducts",
            JSON.stringify(products)
        );

        showProducts();

    }

}


/* CLEAR FORM */

function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("stock").value = "";
    document.getElementById("image").value = "";

}


/* CANCEL EDIT */

function cancelEdit(){

    editIndex = -1;

    clearForm();

    document.getElementById("saveBtn").innerText =
    "Add Product";

    document.getElementById("cancelBtn").style.display =
    "none";

}


/* STATS */

function updateStats(){

    document.getElementById("productCount").innerText =
    products.length;


    let totalStock = 0;

    products.forEach(function(product){

        totalStock += Number(product.stock) || 0;

    });


    document.getElementById("stockCount").innerText =
    totalStock;


    document.getElementById("messageCount").innerText =
    "0";

}


/* START */

showProducts();

</script>

</body>
</html>
