<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  padding:22px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin:7px 0 0;
  color:#cbd5e1;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:14px;
  box-shadow:0 3px 12px #ddd;
}

h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#1677ff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#095fd3;
}

.danger{
  background:#e53935;
}

.danger:hover{
  background:#c62828;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  padding:18px 10px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 3px 10px #ddd;
}

.stat h3{
  margin:0;
  font-size:25px;
}

.stat p{
  margin:6px 0 0;
  color:#777;
}

.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
}

.product h3{
  margin:0 0 7px;
}

.price{
  font-weight:bold;
  color:#1677ff;
  font-size:18px;
}

.empty{
  text-align:center;
  color:#888;
  padding:15px;
}

.back{
  background:#111827;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Smart Seller Shop</h1>
  <p>Admin Panel</p>
</div>

<div class="container">

  <div class="stats">
    <div class="stat">
      <h3 id="productCount">0</h3>
      <p>Products</p>
    </div>

    <div class="stat">
      <h3 id="orderCount">0</h3>
      <p>Orders</p>
    </div>

    <div class="stat">
      <h3 id="totalSales">$0</h3>
      <p>Total Sales</p>
    </div>
  </div>

  <div class="card">
    <h2>Add Product</h2>

    <label>Product Name</label>
    <input id="productName" type="text" placeholder="Enter product name">

    <label>Price</label>
    <input id="productPrice" type="number" placeholder="Enter price">

    <label>Category</label>
    <input id="productCategory" type="text" placeholder="Enter category">

    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products"></div>
  </div>

  <div class="card">
    <h2>Orders</h2>
    <div id="orders"></div>
  </div>

  <div class="card">
    <button class="danger" onclick="clearAllData()">
      Clear All Data
    </button>
  </div>

  <div class="card">
    <button class="back" onclick="location.href='index.html'">
      Back to Shop
    </button>
  </div>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("smartSellerProducts")) || [];

let orders =
JSON.parse(localStorage.getItem("smartSellerOrders")) || [];


function saveData(){

  localStorage.setItem(
    "smartSellerProducts",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "smartSellerOrders",
    JSON.stringify(orders)
  );

}


function addProduct(){

  const name =
  document.getElementById("productName").value.trim();

  const price =
  document.getElementById("productPrice").value;

  const category =
  document.getElementById("productCategory").value.trim();


  if(!name || !price){

    alert("Please enter product name and price.");

    return;
  }


  products.push({

    id:Date.now(),

    name:name,

    price:Number(price),

    category:category || "General"

  });


  saveData();

  document.getElementById("productName").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productCategory").value="";

  displayProducts();

  updateStats();

  alert("Product added successfully!");

}


function deleteProduct(id){

  if(!confirm("Delete this product?")) return;

  products =
  products.filter(function(product){

    return product.id !== id;

  });

  saveData();

  displayProducts();

  updateStats();

}


function displayProducts(){

  const box =
  document.getElementById("products");

  if(products.length === 0){

    box.innerHTML =
    '<div class="empty">No products added yet.</div>';

    return;
  }


  box.innerHTML = "";


  products.forEach(function(product){

    const div =
    document.createElement("div");

    div.className="product";

    div.innerHTML=`

      <h3>${escapeHTML(product.name)}</h3>

      <p>Category:
      ${escapeHTML(product.category)}</p>

      <p class="price">
      $${Number(product.price).toFixed(2)}
      </p>

      <button
      class="danger"
      onclick="deleteProduct(${product.id})">
      Delete
      </button>

    `;

    box.appendChild(div);

  });

}


function displayOrders(){

  const box =
  document.getElementById("orders");


  if(orders.length === 0){

    box.innerHTML =
    '<div class="empty">No orders yet.</div>';

    return;
  }


  box.innerHTML="";


  orders.forEach(function(order,index){

    const div =
    document.createElement("div");

    div.className="product";

    div.innerHTML=`

      <h3>Order #${index + 1}</h3>

      <p>Customer:
      ${escapeHTML(order.customer || "Customer")}
      </p>

      <p class="price">
      $${Number(order.total || 0).toFixed(2)}
      </p>

      <p>Status:
      ${escapeHTML(order.status || "Pending")}
      </p>

    `;

    box.appendChild(div);

  });

}


function updateStats(){

  document.getElementById("productCount")
  .textContent=products.length;

  document.getElementById("orderCount")
  .textContent=orders.length;


  let total=0;

  orders.forEach(function(order){

    total += Number(order.total || 0);

  });


  document.getElementById("totalSales")
  .textContent="$"+total.toFixed(2);

}


function clearAllData(){

  if(!confirm(
    "Are you sure you want to delete all admin data?"
  )) return;


  products=[];
  orders=[];

  saveData();

  displayProducts();

  displayOrders();

  updateStats();

}


function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


displayProducts();

displayOrders();

updateStats();

</script>

</body>
</html>
