const $=id=>document.getElementById(id);

function esc(value){
    return String(value??"").replace(/[&<>"']/g,function(m){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[m];
    });
}

function message(text,type="success"){
    const box=$("messageBox");
    if(!box)return;

    box.textContent=text;
    box.className="message "+type;
    box.style.display="block";

    clearTimeout(window.messageTimer);

    window.messageTimer=setTimeout(function(){
        box.style.display="none";
    },4000);
}

function connection(ok,text){
    const el=$("connection");
    if(!el)return;

    el.textContent=text;
    el.classList.toggle("ok",!!ok);
}

function errorText(error){
    return error && error.message
        ? error.message
        : "Database request failed.";
}

/* =========================
   NAVIGATION
========================= */

function openPage(id){

    document.querySelectorAll(".page").forEach(function(page){
        page.classList.remove("active");
    });

    const page=$(id);

    if(page){
        page.classList.add("active");
    }

    document.querySelectorAll("[data-page]").forEach(function(button){
        button.classList.toggle(
            "active",
            button.dataset.page===id
        );
    });

    if(!db)return;

    if(id==="dashboard") loadDashboard();
    if(id==="balance") loadBalances();
    if(id==="deposits") loadDeposits();
    if(id==="withdrawal") loadWithdrawals();
    if(id==="kyc") loadKYC();
    if(id==="orders") loadOrders();
    if(id==="products") loadProducts();
    if(id==="customers") loadCustomers();
    if(id==="messages") loadMessages();
}

document.querySelectorAll("[data-page]").forEach(function(button){

    button.addEventListener("click",function(event){

        event.preventDefault();

        openPage(this.dataset.page);

    });

});

const refreshButton=$("refreshBtn");

    refreshButton.addEventListener("click",function(){

const addProductButton=$("addProductBtn");

/* =========================
   DATABASE INIT
========================= */

async function init(){

    try{

        if(
            !window.supabase ||
            typeof window.supabase.createClient!=="function"
        ){

            connection(false,"Library Error");

            message(
                "Supabase library could not be loaded.",
                "error"
            );

            return;
        }

        db=window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let test=await db
            .from("products")
            .select("id",{count:"exact",head:true});

        if(!test.error){

            productTable="products";

            connection(true,"Connected");

        }else{

            test=await db
                .from("Products")
                .select("*",{count:"exact",head:true});

            if(!test.error){

                productTable="Products";

                connection(true,"Connected");

            }else{

                connection(false,"DB Error");

                message(
                    "Database connection failed.",
                    "error"
                );

            }
        }

        loadDashboard();

    }catch(error){

        console.error(error);

        connection(false,"DB Error");

        message(
            "Database connection failed.",
            "error"
        );
    }
}

async function loadDashboard(){

    if(!db)return;

    try{

        const products=await db
            .from(productTable)
            .select("id",{count:"exact",head:true});

        const orders=await db
            .from("orders")
            .select("id",{count:"exact",head:true});

        const messages=await db
            .from("support_tickets")
            .select("id",{count:"exact",head:true});

        const withdrawals=await db
            .from("withdrawals")
            .select("id",{count:"exact",head:true});

        $("statProducts").textContent=
            products.error ? "0" : (products.count||0);

        $("statOrders").textContent=
            orders.error ? "0" : (orders.count||0);

        $("statMessages").textContent=
            messages.error ? "0" : (messages.count||0);

        $("statWithdrawals").textContent=
            withdrawals.error ? "0" : (withdrawals.count||0);

    }catch(error){

========================= */

async function loadProducts(){

    const box=$("productList");

    box.className="loading";
    box.textContent="Loading...";

    const result=await db
        .from(productTable)
        .select("*");

    if(result.error){

        box.className="empty";

        box.textContent=
            "Products error: "+
            errorText(result.error);

        return;
    }

    if(!result.data || !result.data.length){

        box.className="empty";
        box.textContent="No products yet.";

        return;
    }

    box.className="";
    box.innerHTML="";

    result.data.forEach(function(product){

        const id=product.id ?? product.Id;

        const name=
            product.name ??
            product.Name ??
            "Product";

        const price=
            Number(
                product.price ??
                product.Price ??
                0
            );

        const stock=
            Number(
                product.stock ??
                product.Stock ??
                0
            );

        const image=
            product.image_url ??
            product["Image url"] ??
            product.image ??
            "";

        const item=document.createElement("div");

        item.className="item";

        item.innerHTML=
            (image
                ? "<img src='"+esc(image)+"' onerror=\"this.style.display='none'\">"
                : "")+

            "<b>📦 "+
            esc(name)+
            "</b>"+

            "<p>Price: $"+
            price.toFixed(2)+
            "</p>"+

            "<p>Stock: "+
            stock+
            "</p>"+

            "<button type='button' class='action red'>Delete</button>";

        item.querySelector("button")
            .addEventListener("click",function(){

                deleteProduct(id);

            });

        box.appendChild(item);

    });
}

async function addProduct(){

    if(!db){

        message(
            "Database is not connected.",
            "error"
        );

        return;
    }

    const name=$("productName").value.trim();

    if(!name){

        message(
            "Product name is required.",
            "error"
        );

        return;
    }

    const payload={
        name:name,
        description:$("productDescription").value.trim(),
        price:Number($("productPrice").value)||0,
        stock:Number($("productStock").value)||0,
        category:$("productCategory").value.trim(),
        image_url:$("productImage").value.trim(),
        is_active:true
    };

    let result=await db
        .from(productTable)
        .insert(payload);

    if(
        result.error &&
        productTable==="Products"
    ){

        result=await db
            .from("Products")
            .insert({
                Name:name,
                Description:payload.description,
                Price:payload.price,
                Stock:payload.stock,
                Category:payload.category,
                "Image url":payload.image_url
            });
    }

    if(result.error){

        message(
            errorText(result.error),
            "error"
        );

        return;
    }

    document
        .querySelectorAll(
            "#products input,#products textarea"
        )
        .forEach(function(input){
            input.value="";
        });

    message("Product added successfully.");

    loadProducts();
    loadDashboard();
}

async function deleteProduct(id){

    if(!db || id==null)return;

    if(!confirm("Delete this product?"))return;

    const key=
        productTable==="Products"
        ? "Id"
        : "id";

    const result=await db
        .from(productTable)
        .delete()
        .eq(key,id);

    if(result.error){

        message(
            errorText(result.error),
            "error"
        );

        return;
    }

    message("Product deleted.");

    loadProducts();
    loadDashboard();
}

/* =========================
   BALANCE
========================= */

async function loadBalances(){

    const box=$("balanceList");

    box.className="loading";
    box.textContent="Loading...";

    const result=await db
        .from("customer_balances")
        .select("*")
        .order(
            "updated_at",
            {ascending:false}
        );

    if(result.error){

        box.className="empty";

        box.textContent=
            "Balance error: "+
            errorText(result.error);

        return;
    }

    if(!result.data || !result.data.length){

        box.className="empty";
        box.textContent="No customer balances yet.";

        return;
    }

    box.className="";
    box.innerHTML="";

    result.data.forEach(function(customer){

        const item=document.createElement("div");

        item.className="item";

        item.innerHTML=
            "<b>👤 "+
            esc(
                customer.customer_name ||
                customer.customer_id ||
                "Customer"
            )+
            "</b>"+

            "<p>Customer ID: "+
            esc(customer.customer_id||"")+
            "</p>"+

            "<p>Current Balance: <b>$"+
            Number(customer.balance||0).toFixed(2)+
            "</b></p>"+

            "<input type='number' min='0' step='0.01' placeholder='New balance'>"+

            "<button type='button' class='action'>Update Balance</button>";

        item.querySelector("button")
            .addEventListener("click",async function(){

                const value=
                    Number(
                        item.querySelector("input").value
                    );

                if(!Number.isFinite(value)||value<0){

                    message(
                        "Enter a valid balance.",
                        "error"
                    );

                    return;
                }

                const update=await db
                    .from("customer_balances")
                    .update({
                        balance:value,
                        updated_at:new Date().toISOString()
                    })
                    .eq("id",customer.id);

                if(update.error){

                    message(
                        errorText(update.error),
                        "error"
                    );

                }else{

                    message("Balance updated.");

                    loadBalances();

                }

            });

        box.appendChild(item);

    });
}

async function approveDeposit(
    deposit,
    approve,
    reject
){

    if(
        String(
            deposit.status ||
            "Pending"
        ).toLowerCase()!=="pending"
    ){

        message(
            "This deposit is already processed.",
            "error"
        );

        return;
    }

    approve.disabled=true;
    reject.disabled=true;

    const amount=
        Number(deposit.amount||0);

    if(
        !deposit.id ||
        !deposit.customer_id ||
        amount<=0
    ){

        message(
            "Invalid deposit data.",
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

        return;
    }

    /*
       First try the safe database RPC.
       This is the preferred method because
       it prevents double credit.
    */

    const rpc=await db.rpc(
        "approve_deposit",
        {
            p_deposit_id:deposit.id
        }
    );

    if(!rpc.error){

        message(
            "Deposit approved. Balance credited once."
        );

        loadDeposits();
        loadBalances();
        loadDashboard();

        return;
    }

    /*
       Fallback for projects where the RPC
       function has not been created yet.
    */

    const current=await db
        .from("deposit_requests")
        .select("status")
        .eq("id",deposit.id)
        .maybeSingle();

    if(
        current.error ||
        !current.data ||
        String(
            current.data.status||"Pending"
        ).toLowerCase()!=="pending"
    ){

        message(
            "This deposit was already processed.",
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

        loadDeposits();

        return;
    }

    const mark=await db
        .from("deposit_requests")
        .update({
            status:"Approved"
        })
        .eq("id",deposit.id)
        .eq("status","Pending");

    if(mark.error){

        message(
            errorText(mark.error),
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

        return;
    }

    const balance=await db
        .from("customer_balances")
        .select("*")
        .eq(
            "customer_id",
            deposit.customer_id
        )
        .maybeSingle();

    if(balance.error){

        await db
            .from("deposit_requests")
            .update({status:"Pending"})
            .eq("id",deposit.id);

        message(
            "Balance lookup failed.",
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

        return;
    }

    let update;

    if(balance.data){

        update=await db
            .from("customer_balances")
            .update({
                balance:
                    Number(
                        balance.data.balance||0
                    )+
                    amount,

                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                balance.data.id
            );

    }else{

        update=await db
            .from("customer_balances")
            .insert({
                customer_id:
                    deposit.customer_id,

                customer_name:
                    deposit.customer_name||"",

                balance:amount,

                updated_at:
                    new Date().toISOString()
            });

    }

    if(update.error){

        await db
            .from("deposit_requests")
            .update({status:"Pending"})
            .eq("id",deposit.id);

        message(
            "Balance update failed.",
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

        return;
    }

    message(
        "Deposit approved. Balance credited once."
    );

    loadDeposits();
    loadBalances();
    loadDashboard();
}

async function rejectDeposit(
    deposit,
    approve,
    reject
){

    if(!confirm("Reject this deposit request?"))
        return;

    approve.disabled=true;
    reject.disabled=true;

    const result=await db
        .from("deposit_requests")
        .update({
            status:"Rejected"
        })
        .eq("id",deposit.id)
        .eq("status","Pending");

    if(result.error){

        message(
            errorText(result.error),
            "error"
        );

        approve.disabled=false;
        reject.disabled=false;

    }else{

        message("Deposit rejected.");

        loadDeposits();
        loadDashboard();

    }
}
