<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:7px 0 0;
    color:#ccc;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:16px;
    box-shadow:0 3px 15px #ddd;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:white;
    padding:20px 10px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 12px #ddd;
}

.stat h2{
    margin:0;
    font-size:30px;
}

.stat p{
    margin:8px 0 0;
    color:#777;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#0d65d9;
}

.cancel{
    background:#777;
    margin-top:8px;
}

.delete{
    background:#e53935;
    margin-top:7px;
}

.edit{
    background:#ff9800;
    margin-top:7px;
}

.product{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.product img{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}

.product h3{
    margin:5px 0;
}

.product p{
    margin:6px 0;
    color:#555;
}

.status{
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.loading{
    text-align:center;
    padding:15px;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Smart Seller Shop</h1>
    <p>Admin Panel</p>
</div>

<div class="container">

    <div id="status" class="status"></div>

    <div class="stats">

        <div class="stat">
            <h2 id="productCount">0</h2>
            <p>Products</p>
        </div>

        <div class="stat">
            <h2 id="messageCount">0</h2>
            <p>Messages</p>
        </div>

        <div class="stat">
            <h2 id="stockCount">0</h2>
            <p>Total Stock</p>
        </div>

    </div>

    <br>

    <div class="card">

        <h2>➕ Add New Product</h2>

        <label>Product Name</label>
        <input id="name"
               type="text"
               placeholder="Example: Samsung Phone">

        <label>Price</label>
        <input id="price"
               type="number"
               step="0.01"
               placeholder="100">

        <label>Stock</label>
        <input id="stock"
               type="number"
               placeholder="10">

        <label>Category</label>

        <select id="category">
            <option value="Phone">Phone</option>
            <option value="Laptop">Laptop</option>
            <option value="Accessories">Accessories</option>
            <option value="Other">Other</option>
        </select>

        <label>Product Image URL</label>

        <input id="image"
               type="text"
               placeholder="https://example.com/image.jpg">

        <button id="saveBtn" onclick="saveProduct()">
            Add Product
        </button>

        <button class="cancel"
                id="cancelBtn"
                onclick="cancelEdit()"
                style="display:none">
            Cancel Edit
        </button>

    </div>

    <div class="card">

        <h2>📦 Products</h2>

        <div id="products">
            <div class="loading">Loading products...</div>
        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"https://cgrwiwzqiusvjibpjzdv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_du1gsmfC1UqGUpc40-uHiQ_P-2T8wnV";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   VARIABLES
================================ */

let products = [];
let editId = null;


/* ================================
   STATUS MESSAGE
================================ */

function showStatus(message, type){

    const status =
    document.getElementById("status");

    status.innerText = message;

    status.className =
    "status " + type;

    setTimeout(function(){

        status.className = "status";

    },4000);
}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    const box =
    document.getElementById("products");

    box.innerHTML =
    '<div class="loading">Loading products...</div>';

    const { data, error } =
    await supabaseClient
    .from("Products")
    .select("*")
    .order("id", { ascending:false });


    if(error){

        console.error(error);

        box.innerHTML =
        "<p>Products load نہیں ہو سکے۔</p>";

        showStatus(
            "Supabase connection error: " + error.message,
            "error"
        );

        return;
    }


    products = data || [];

    showProducts();

    await loadMessageCount();
}


/* ================================
   SAVE / UPDATE PRODUCT
================================ */

async function saveProduct(){

    const name =
    document.getElementById("name")
    .value.trim();

    const price =
    document.getElementById("price")
    .value;

    const stock =
    document.getElementById("stock")
    .value;

    const category =
    document.getElementById("category")
    .value;

    const image =
    document.getElementById("image")
    .value.trim();


    if(!name || price === "" || stock === ""){

        showStatus(
            "Product Name, Price اور Stock لازمی بھریں۔",
            "error"
        );

        return;
    }


    const productData = {

        name: name,

        price: Number(price),

        stock: Number(stock),

        category: category,

        image_url: image || null

    };


    const button =
    document.getElementById("saveBtn");

    button.disabled = true;

    button.innerText =
    editId === null
    ? "Adding..."
    : "Updating...";


    let result;


    if(editId === null){

        result =
        await supabaseClient
        .from("Products")
        .insert([productData]);

    }else{

        result =
        await supabaseClient
        .from("Products")
        .update(productData)
        .eq("id", editId);

    }


    if(result.error){

        console.error(result.error);

        showStatus(
            "Error: " + result.error.message,
            "error"
        );

        button.disabled = false;

        button.innerText =
        editId === null
        ? "Add Product"
        : "Update Product";

        return;
    }


    if(editId === null){

        showStatus(
            "Product کامیابی سے Add ہو گیا! ✅",
            "success"
        );

    }else{

        showStatus(
            "Product کامیابی سے Update ہو گیا! ✅",
            "success"
        );

    }


    editId = null;

    clearForm();

    button.disabled = false;

    button.innerText =
    "Add Product";

    document.getElementById("cancelBtn")
    .style.display = "none";


    await loadProducts();
}


/* ================================
   SHOW PRODUCTS
================================ */

function showProducts(){

    const box =
    document.getElementById("products");

    box.innerHTML = "";


    if(products.length === 0){

        box.innerHTML =
        "<p>No products added yet.</p>";

        updateStats();

        return;
    }


    products.forEach(function(product){

        let imageHTML = "";

        if(product.image_url){

            imageHTML = `
            <img
                src="${escapeHTML(product.image_url)}"
                onerror="this.style.display='none'"
            >
            `;

        }


        box.innerHTML += `

        <div class="product">

            ${imageHTML}

            <h3>
                ${escapeHTML(product.name || "")}
            </h3>

            <p>
                <b>Price:</b>
                $${Number(product.price || 0)}
            </p>

            <p>
                <b>Stock:</b>
                ${Number(product.stock || 0)}
            </p>

            <p>
                <b>Category:</b>
                ${escapeHTML(product.category || "")}
            </p>

            <button
                class="edit"
                onclick="editProduct(${product.id})">
                ✏️ Edit Product
            </button>

            <button
                class="delete"
                onclick="deleteProduct(${product.id})">
                🗑️ Delete Product
            </button>

        </div>

        `;

    });


    updateStats();
}


/* ================================
   EDIT PRODUCT
================================ */

function editProduct(id){

    const product =
    products.find(function(item){

        return item.id === id;

    });


    if(!product){

        showStatus(
            "Product نہیں ملا۔",
            "error"
        );

        return;
    }


    document.getElementById("name")
    .value = product.name || "";

    document.getElementById("price")
    .value = product.price || "";

    document.getElementById("stock")
    .value = product.stock || "";

    document.getElementById("category")
    .value = product.category || "Other";

    document.getElementById("image")
    .value = product.image_url || "";


    editId = product.id;


    document.getElementById("saveBtn")
    .innerText = "Update Product";


    document.getElementById("cancelBtn")
    .style.display = "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ================================
   DELETE PRODUCT
================================ */

async function deleteProduct(id){

    if(!confirm("Delete this product?")){

        return;
    }


    const { error } =
    await supabaseClient
    .from("Products")
    .delete()
    .eq("id", id);


    if(error){

        console.error(error);

        showStatus(
            "Delete error: " + error.message,
            "error"
        );

        return;
    }


    showStatus(
        "Product delete ہو گیا! 🗑️",
        "success"
    );


    await loadProducts();
}


/* ================================
   CLEAR FORM
================================ */

function clearForm(){

    document.getElementById("name")
    .value = "";

    document.getElementById("price")
    .value = "";

    document.getElementById("stock")
    .value = "";

    document.getElementById("image")
    .value = "";

    document.getElementById("category")
    .value = "Phone";
}


/* ================================
   CANCEL EDIT
================================ */

function cancelEdit(){

    editId = null;

    clearForm();


    document.getElementById("saveBtn")
    .innerText = "Add Product";


    document.getElementById("cancelBtn")
    .style.display = "none";
}


/* ================================
   STATS
================================ */

function updateStats(){

    document.getElementById("productCount")
    .innerText = products.length;


    let totalStock = 0;


    products.forEach(function(product){

        totalStock +=
        Number(product.stock) || 0;

    });


    document.getElementById("stockCount")
    .innerText = totalStock;
}


/* ================================
   MESSAGE COUNT
================================ */

async function loadMessageCount(){

    const { count, error } =
    await supabaseClient
    .from("support_tickets")
    .select("*", {
        count:"exact",
        head:true
    });


    if(error){

        console.error(
            "Message count error:",
            error
        );

        document.getElementById("messageCount")
        .innerText = "0";

        return;
    }


    document.getElementById("messageCount")
    .innerText = count || 0;
}


/* ================================
   HTML SECURITY
================================ */

function escapeHTML(value){

    return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}


/* ================================
   START
================================ */

loadProducts();

</script>

</body>
    </html>
