<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Shop - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
.header{background:#111827;color:white;padding:22px 15px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;color:#ccc}
.container{max-width:900px;margin:auto;padding:15px}
.card,.stat{background:white;border-radius:16px;box-shadow:0 3px 15px #ddd}
.card{padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{padding:20px 10px;text-align:center}.stat h2{margin:0;font-size:30px}.stat p{margin:8px 0 0;color:#777}
label{display:block;margin-top:8px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #ddd;border-radius:10px;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#1877f2;color:white;font-size:17px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.cancel{background:#777;margin-top:8px}.delete{background:#e53935;margin-top:8px}.edit{background:#ff9800;margin-bottom:7px}
.product{border:1px solid #ddd;border-radius:12px;padding:15px;margin-top:12px}
.product img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.product h3{margin:5px 0}.product p{margin:6px 0;color:#555}
.message{padding:13px;border-radius:10px;margin-bottom:15px;display:none;font-weight:bold}
.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
.loading,.empty{text-align:center;padding:20px;color:#777}
.support-message{border:1px solid #ddd;border-radius:12px;padding:15px;margin-top:12px;background:#fafafa}
.support-message .reply{background:#ecfdf5;padding:12px;border-radius:10px;margin-top:10px;color:#166534}
.support-date{font-size:12px;color:#777;margin:5px 0 10px}
.reply-box{margin-top:12px;padding-top:12px;border-top:1px solid #ddd}
.small-btn{font-size:15px;padding:12px;margin-top:7px}
@media(max-width:600px){.stats{grid-template-columns:1fr}.header h1{font-size:25px}}
</style>
</head>
<body>

<div class="header">
<h1>Smart Seller Shop</h1>
<p>Admin Panel</p>
</div>

<div class="container">

<div id="messageBox" class="message"></div>

<div class="stats">
<div class="stat"><h2 id="productCount">0</h2><p>Products</p></div>
<div class="stat"><h2 id="messageCount">0</h2><p>Messages</p></div>
<div class="stat"><h2 id="stockCount">0</h2><p>Total Stock</p></div>
</div>

<div class="card">
<h2 id="formTitle">➕ Add New Product</h2>
<label>Product Name</label>
<input id="name" type="text" placeholder="Example: Samsung Phone">
<label>Description</label>
<textarea id="description" placeholder="Product description"></textarea>
<label>Price</label>
<input id="price" type="number" step="0.01" placeholder="100">
<label>Stock</label>
<input id="stock" type="number" placeholder="10">
<label>Category</label>
<select id="category">
<option value="Phone">Phone</option>
<option value="Laptop">Laptop</option>
<option value="Accessories">Accessories</option>
<option value="Other">Other</option>
</select>
<label>Product Image URL</label>
<input id="image" type="text" placeholder="https://example.com/image.jpg">
<button id="saveBtn" onclick="saveProduct()">Add Product</button>
<button class="cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel Edit</button>
</div>

<div class="card">
<h2>📦 Products</h2>
<div id="products"><div class="loading">Products loading...</div></div>
</div>

<div class="card">
<h2>💬 Customer Messages</h2>
<div id="supportMessages"><div class="loading">Messages loading...</div></div>
</div>

</div>

<script>
const SUPABASE_URL="https://cgrwiwzqiusvjibpjzdv.supabase.co";
const SUPABASE_KEY="sb_publishable_du1gsmfC1UqGUpc40-uHiQ_P-2T8wnV";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let editId=null;

function showMessage(text,type){
 const box=document.getElementById("messageBox");
 box.innerText=text; box.className="message "+type; box.style.display="block";
 setTimeout(()=>box.style.display="none",5000);
}

function getProductId(p){return p["Id"] ?? p["id"] ?? null;}

async function loadProducts(){
 const box=document.getElementById("products");
 box.innerHTML='<div class="loading">Products loading...</div>';
 const {data,error}=await supabaseClient.from("Products").select("*");
 if(error){box.innerHTML='<div class="empty">Products could not be loaded.</div>';showMessage(error.message,"error");return;}
 products=data||[];
 products.sort((a,b)=>Number(getProductId(b)||0)-Number(getProductId(a)||0));
 showProducts(); updateStats();
}

async function saveProduct(){
 const name=document.getElementById("name").value.trim();
 const description=document.getElementById("description").value.trim();
 const price=document.getElementById("price").value;
 const stock=document.getElementById("stock").value;
 const category=document.getElementById("category").value;
 const image=document.getElementById("image").value.trim();
 if(!name||price===""||stock===""){showMessage("Product Name, Price aur Stock zaroor bharain.","error");return;}
 const productData={"Name":name,"Description":description||null,"Price":Number(price),"Stock":Number(stock),"Category":category,"Image url":image||null};
 const btn=document.getElementById("saveBtn");btn.disabled=true;btn.innerText="Saving...";
 let result;
 if(editId===null) result=await supabaseClient.from("Products").insert([productData]);
 else result=await supabaseClient.from("Products").update(productData).eq("Id",editId);
 if(result.error) showMessage(result.error.message,"error");
 else {showMessage(editId===null?"Product Successfully Added! ✅":"Product Successfully Updated! ✅","success");cancelEdit();await loadProducts();}
 btn.disabled=false;btn.innerText=editId===null?"Add Product":"Update Product";
}

function showProducts(){
 const box=document.getElementById("products");box.innerHTML="";
 if(!products.length){box.innerHTML='<div class="empty">No products added yet.</div>';return;}
 products.forEach(p=>{
  const id=getProductId(p),name=p["Name"]??p["name"]??"Unnamed Product";
  const desc=p["Description"]??p["description"]??"",price=Number(p["Price"]??p["price"]??0);
  const stock=p["Stock"]??p["stock"]??0,category=p["Category"]??p["category"]??"Other";
  const image=p["Image url"]??p["image"]??p["image_url"]??"";
  const div=document.createElement("div");div.className="product";
  if(image){const img=document.createElement("img");img.src=image;img.alt=name;img.onerror=function(){this.style.display="none"};div.appendChild(img);}
  div.innerHTML+=`<h3>${escapeHTML(name)}</h3>${desc?`<p><b>Description:</b> ${escapeHTML(desc)}</p>`:""}<p><b>Price:</b> $${price.toFixed(2)}</p><p><b>Stock:</b> ${escapeHTML(stock)}</p><p><b>Category:</b> ${escapeHTML(category)}</p>`;
  const edit=document.createElement("button");edit.className="edit";edit.innerText="✏️ Edit Product";edit.onclick=()=>editProduct(id);div.appendChild(edit);
  const del=document.createElement("button");del.className="delete";del.innerText="🗑️ Delete Product";del.onclick=()=>deleteProduct(id);div.appendChild(del);
  box.appendChild(div);
 });
}

function editProduct(id){
 const p=products.find(x=>Number(getProductId(x))===Number(id));if(!p)return;
 document.getElementById("name").value=p["Name"]??p["name"]??"";
 document.getElementById("description").value=p["Description"]??p["description"]??"";
 document.getElementById("price").value=p["Price"]??p["price"]??"";
 document.getElementById("stock").value=p["Stock"]??p["stock"]??"";
 document.getElementById("category").value=p["Category"]??p["category"]??"Other";
 document.getElementById("image").value=p["Image url"]??p["image"]??p["image_url"]??"";
 editId=getProductId(p);document.getElementById("formTitle").innerText="✏️ Edit Product";
 document.getElementById("saveBtn").innerText="Update Product";document.getElementById("cancelBtn").style.display="block";
 scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
 if(!confirm("Kya aap is product ko delete karna chahte hain?"))return;
 const {error}=await supabaseClient.from("Products").delete().eq("Id",id);
 if(error){showMessage(error.message,"error");return;}
 showMessage("Product Delete ho gaya! 🗑️","success");await loadProducts();
}

function cancelEdit(){
 editId=null;clearForm();document.getElementById("formTitle").innerText="➕ Add New Product";
 document.getElementById("saveBtn").innerText="Add Product";document.getElementById("cancelBtn").style.display="none";
}
function clearForm(){
 ["name","description","price","stock","image"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("category").value="Phone";
}

async function updateStats(){
 document.getElementById("productCount").innerText=products.length;
 document.getElementById("stockCount").innerText=products.reduce((s,p)=>s+(Number(p["Stock"]??p["stock"]??0)||0),0);
 loadSupportMessages();
}

function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

/* ================= CUSTOMER MESSAGES ================= */

async function loadSupportMessages(){
 const box=document.getElementById("supportMessages");
 box.innerHTML='<div class="loading">Messages loading...</div>';
 const {data,error,count}=await supabaseClient.from("support_tickets").select("*",{count:"exact"}).order("created_at",{ascending:false});
 if(error){console.error(error);box.innerHTML='<div class="empty">Messages could not be loaded.</div>';document.getElementById("messageCount").innerText="0";return;}
 document.getElementById("messageCount").innerText=count??(data||[]).length;
 if(!data||!data.length){box.innerHTML='<div class="empty">No customer messages yet.</div>';return;}
 box.innerHTML="";
 data.forEach(message=>{
  const id=message.id??message.Id;
  const text=message.message??"";
  const date=message.created_at?new Date(message.created_at).toLocaleString():"";
  const status=message.status??"Open";
  const reply=message.admin_reply??message.reply??"";
  const div=document.createElement("div");div.className="support-message";
  div.innerHTML=`<b>Customer Message</b><div class="support-date">${escapeHTML(date)}</div><div>${escapeHTML(text)}</div><p><b>Status:</b> ${escapeHTML(status)}</p>`;
  if(reply){const r=document.createElement("div");r.className="reply";r.innerHTML="<b>Admin Reply:</b><br>"+escapeHTML(reply);div.appendChild(r);}
  const replyArea=document.createElement("div");replyArea.className="reply-box";
  const ta=document.createElement("textarea");ta.placeholder="Write reply to customer...";ta.value="";
  const send=document.createElement("button");send.className="small-btn";send.innerText="↩️ Send Reply";
  send.onclick=()=>replyToCustomer(id,ta.value,send);
  const del=document.createElement("button");del.className="delete small-btn";del.innerText="🗑️ Delete Message";
  del.onclick=()=>deleteSupportMessage(id);
  replyArea.appendChild(ta);replyArea.appendChild(send);replyArea.appendChild(del);div.appendChild(replyArea);box.appendChild(div);
 });
}

async function replyToCustomer(id,reply,button){
 reply=reply.trim();if(!reply){alert("Please write a reply.");return;}
 button.disabled=true;button.innerText="Sending...";
 const {error}=await supabaseClient.from("support_tickets").update({admin_reply:reply,status:"Replied"}).eq("id",id);
 if(error){alert("Reply could not be sent: "+error.message);button.disabled=false;button.innerText="↩️ Send Reply";return;}
 showMessage("Reply sent successfully! ✅","success");await loadSupportMessages();
}

async function deleteSupportMessage(id){
 if(id===undefined||id===null){alert("Message ID not found.");return;}
 if(!confirm("Are you sure you want to delete this customer message?"))return;
 const {error}=await supabaseClient.from("support_tickets").delete().eq("id",id);
 if(error){alert("Message could not be deleted: "+error.message);return;}
 showMessage("Customer message deleted! 🗑️","success");await loadSupportMessages();
}

loadProducts();
</script>
</body>
</html>
